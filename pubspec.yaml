name: threadsense
description: AI-powered body scanning and styling app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Navigation
  go_router: ^14.0.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Camera & AR
  camera: ^0.11.0
  arkit_plugin: ^1.0.7
  arcore_flutter_plugin: ^0.1.0

  # ML & Computer Vision
  google_mlkit_pose_detection: ^0.12.0
  tflite_flutter: ^0.11.0

  # Networking
  dio: ^5.4.0

  # Local Storage
  hive: any
  hive_flutter: any
  flutter_secure_storage: ^9.2.0

  # UI/UX
  lottie: ^3.1.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  model_viewer_plus: ^1.7.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0

  # Utilities
  permission_handler: ^11.3.0
  flutter_tts: ^4.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.2.0
  uuid: ^4.3.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Icons
  iconsax_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  mockito: ^5.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/models/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
